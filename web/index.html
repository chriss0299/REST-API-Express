<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SocialPlace</title>
    <link rel="stylesheet" href="stile.css" />
  </head>
  <body>
    <!-- ======================================================
         Navbar
         ====================================================== -->
    <header>
      <div class="navbar-inner">
        <div class="navbar-logo">&#9670; SocialPlace</div>
        <nav>
          <button id="nav-utenti" class="attivo">Persone</button>
          <button id="nav-post">Feed</button>
          <button id="nav-commenti">Commenti</button>
        </nav>
        <button id="btn-logout" class="btn-logout-nav">Esci</button>
      </div>
    </header>

    <!-- ======================================================
         Layout: sidebar | main | sidebar
         ====================================================== -->
    <div class="layout">

      <!-- Sidebar sinistra -->
      <aside class="sidebar-sx">
        <div id="statistiche" class="stats-box"></div>

        <section id="sezione-login" class="login-widget">
          <h3>Accedi</h3>
          <form id="form-login">
            <input type="email" id="login-email" placeholder="Email" required />
            <input type="password" id="login-password" placeholder="Password" required />
            <button type="submit">Entra</button>
          </form>
          <p id="stato-login" class="stato-login">Non sei autenticato</p>
        </section>
      </aside>

      <!-- Contenuto principale -->
      <main class="main-content">

        <!-- Sezione Utenti (Persone) -->
        <section id="sezione-utenti">
          <form id="form-utente" class="form-card">
            <h3>Nuovo Utente</h3>
            <div class="form-grid">
              <div class="form-row">
                <label for="utente-nome">Nome</label>
                <input type="text" id="utente-nome" placeholder="Es. Yoshi Verde" required />
              </div>
              <div class="form-row">
                <label for="utente-email">Email</label>
                <input type="email" id="utente-email" placeholder="yoshi@email.com" required />
              </div>
              <div class="form-row">
                <label for="utente-citta">Città (opz.)</label>
                <input type="text" id="utente-citta" placeholder="Es. Roma" />
              </div>
              <div class="form-row">
                <label for="utente-cf">Codice Fiscale</label>
                <input type="text" id="utente-cf" placeholder="RSSMRA90A01H501A"
                  pattern="^[A-Za-z]{6}[0-9]{2}[A-Za-z][0-9]{2}[A-Za-z][0-9]{3}[A-Za-z]$"
                  maxlength="16" required />
              </div>
              <div class="form-row">
                <label for="utente-sesso">Sesso</label>
                <select id="utente-sesso" required>
                  <option value="">-- Seleziona --</option>
                  <option value="M">Maschio</option>
                  <option value="F">Femmina</option>
                  <option value="Altro">Altro</option>
                </select>
              </div>
              <div class="form-row">
                <label for="utente-data-nascita">Data di Nascita (opz.)</label>
                <input type="date" id="utente-data-nascita" />
              </div>
              <div class="form-row">
                <label for="utente-telefono">Telefono (opz.)</label>
                <input type="tel" id="utente-telefono" placeholder="+39 06 1234567" />
              </div>
            </div>
            <div class="form-azioni">
              <button type="button" id="btn-annulla-modifica" class="btn-pericolo" style="display:none">
                Annulla
              </button>
              <button type="submit" class="btn-primario">Crea Utente</button>
            </div>
          </form>

          <div class="box-ricerca">
            <input type="text" id="ricerca-utenti" placeholder="Cerca persone..." />
          </div>

          <div id="lista-utenti" class="griglia-utenti"></div>
        </section>

        <!-- Sezione Post (Feed) -->
        <section id="sezione-post" class="nascosta">
          <div id="breadcrumb-post" class="breadcrumb"></div>
          <h2 id="titolo-post">Feed</h2>

          <form id="form-post" class="form-card">
            <h3>Nuovo Post</h3>
            <div class="form-row">
              <label for="post-userId">User ID</label>
              <input type="number" id="post-userId" placeholder="Es. 1" required />
            </div>
            <div class="form-row">
              <label for="post-titolo">Titolo</label>
              <input type="text" id="post-titolo" placeholder="Es. Il mio primo post" required />
            </div>
            <div class="form-row">
              <label for="post-corpo">Contenuto</label>
              <textarea id="post-corpo" placeholder="Scrivi qualcosa..." required></textarea>
            </div>
            <div class="form-azioni">
              <button type="submit" class="btn-primario">Pubblica</button>
            </div>
          </form>

          <div id="lista-post"></div>
          <div id="paginazione-post" class="paginazione"></div>
        </section>

        <!-- Sezione Commenti -->
        <section id="sezione-commenti" class="nascosta">
          <div id="breadcrumb-commenti" class="breadcrumb"></div>
          <h2 id="titolo-commenti">Commenti</h2>

          <form id="form-commento" class="form-card">
            <h3>Nuovo Commento</h3>
            <div class="form-row">
              <label for="commento-postId">Post ID</label>
              <input type="number" id="commento-postId" placeholder="Es. 1" required />
            </div>
            <div class="form-row">
              <label for="commento-nome">Nome</label>
              <input type="text" id="commento-nome" placeholder="Mario Rossi" required />
            </div>
            <div class="form-row">
              <label for="commento-email">Email</label>
              <input type="email" id="commento-email" placeholder="mario@email.com" required />
            </div>
            <div class="form-row">
              <label for="commento-corpo">Commento</label>
              <textarea id="commento-corpo" placeholder="Scrivi un commento..." required></textarea>
            </div>
            <div class="form-azioni">
              <button type="submit" class="btn-primario">Pubblica</button>
            </div>
          </form>

          <div id="lista-commenti"></div>
        </section>

      </main>

      <!-- Sidebar destra -->
      <aside class="sidebar-dx">
        <div class="sidebar-box">
          <p class="sidebar-box-titolo">&#9670; SocialPlace</p>
          <p class="sidebar-box-desc">
            Un social network didattico per imparare le REST API con Node.js ed Express.
          </p>
        </div>
      </aside>

    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
